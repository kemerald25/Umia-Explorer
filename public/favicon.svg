<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="22" fill="#020617"/>
  <defs>
    <linearGradient id="emeraldGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Left U branch -->
    <path d="M 28 26 C 28 26, 38 28, 42 42 C 45 53, 40 68, 28 68 C 18 68, 14 55, 14 42 L 14 26 C 14 26, 24 26, 28 26 Z" fill="url(#emeraldGrad)"/>
    <path d="M 26 34 C 26 34, 32 38, 34 46 C 36 54, 32 62, 26 62 L 26 34 Z" fill="#6ee7b7" opacity="0.4"/>
    
    <!-- Base bridge -->
    <path d="M 10 70 C 10 67, 12 65, 15 65 L 42 65 C 54 65, 62 57, 65 48 C 68 39, 68 28, 78 26 C 84 25, 87 29, 87 31 C 87 31, 80 32, 76 40 C 72 49, 68 62, 54 70 C 44 76, 30 76, 15 76 C 12 76, 10 73, 10 70 Z" fill="url(#bridgeGrad)"/>

    <!-- Right ascending branch -->
    <path d="M 52 64 C 60 58, 68 47, 72 38 C 74 33, 76 29, 84 27 L 84 32 C 77 34, 73 40, 71 47 C 67 61, 58 72, 45 74 L 52 64 Z" fill="url(#cyanGrad)"/>
    <path d="M 76 34 C 80 33, 84 34, 84 34 C 84 34, 81 48, 77 56 C 74 62, 69 68, 61 74 C 67 68, 73 58, 76 48 C 78 40, 76 34, 76 34 Z" fill="url(#cyanGrad)" opacity="0.85"/>

    <!-- Consensus node -->
    <circle cx="62" cy="49" r="4.5" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="62" cy="49" r="2" fill="#67e8f9"/>
  </g>
</svg>
